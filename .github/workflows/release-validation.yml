name: Release validation

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - wallet-lab-fixes-20260409
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-consensus:
    name: Python consensus and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      WEPO_NETWORK_PROFILE: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            backend/requirements.txt
            wepo-blockchain/requirements.txt
      - uses: dtolnay/rust-toolchain@1.87.0
      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r wepo-blockchain/requirements.txt \
            -r backend/requirements.txt \
            -r requirements-test.txt
      - name: Build rescue hashing binary
        working-directory: zk
        run: cargo build --release --locked --bin poolhash --bin fieldhash
      - name: Compile consensus and boundary modules
        run: |
          python -m py_compile \
            wepo-blockchain/core/blockchain.py \
            wepo-blockchain/core/network_profile.py \
            wepo-blockchain/core/p2p_network.py \
            wepo-blockchain/core/shielded.py \
            wepo-blockchain/core/shielded_verifier.py \
            wepo-blockchain/core/validator_signer.py \
            wepo-blockchain/core/wepo_node.py
      - name: Run complete Python matrix
        run: python -m pytest -q tests

  rust-ghost:
    name: Rust Ghost release suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: zk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test locked release graph
        run: cargo test --release --locked --all-targets
      - name: Build verifier evidence binaries
        run: >-
          cargo build --release --locked
          --bin poolhash
          --bin fieldhash
          --bin ghost_verifier
          --bin ghost_fixture

  rust-ghost-fuzz:
    name: Rust Ghost protocol and verifier fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: zk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-31
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run locked Ghost protocol fuzz smoke
        run: >-
          cargo fuzz run ghost_protocol fuzz/seeds/ghost_protocol --
          -dict=fuzz/dictionaries/ghost_protocol.dict
          -runs=1000000
          -max_len=4096
          -timeout=5
          -jobs=1
          -workers=1
      - name: Generate honest verifier corpus seed
        run: |
          mkdir -p "$RUNNER_TEMP/ghost-verifier-corpus"
          cargo run --release --locked --bin ghost_fixture -- \
            "$RUNNER_TEMP/ghost-verifier-corpus/honest_request"
      - name: Run real Ghost verifier fuzz smoke
        run: >-
          cargo fuzz run ghost_verifier_request
          "$RUNNER_TEMP/ghost-verifier-corpus" --
          -runs=1000
          -max_len=131072
          -timeout=5
          -jobs=1
          -workers=1

  wallet-and-frontend:
    name: Wallet interop and production frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      PYTHONUTF8: "1"
      WEPO_NETWORK_PROFILE: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            wepo-blockchain/requirements.txt
      - name: Install blockchain and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r wepo-blockchain/requirements.txt \
            -r requirements-test.txt
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit complete frontend dependency graph
        working-directory: frontend
        run: npm audit
      - name: Verify committed wallet vector is reproducible
        run: |
          node tests/generate_wallet_signing_vector.mjs
          git diff --exit-code -- tests/vectors/wallet_signing_v2.json
      - name: Produce live JavaScript wallet signing fixture
        run: node tests/wallet_signer_xcheck.mjs
      - name: Verify live wallet fixture in Python consensus
        run: python tests/wallet_signer_xcheck.py
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  desktop-windows:
    name: Windows desktop package boundary
    needs: wallet-and-frontend
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      WEPO_NETWORK_PROFILE: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            wepo-desktop-wallet/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit complete frontend dependency graph
        working-directory: frontend
        run: npm audit
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Install pinned desktop dependencies
        working-directory: wepo-desktop-wallet
        run: npm ci
      - name: Build Ghost artifacts before canonical verification
        working-directory: wepo-desktop-wallet
        shell: pwsh
        run: npm run build-ghost-artifacts
      - name: Audit shipped desktop dependencies
        working-directory: wepo-desktop-wallet
        run: npm audit --omit=dev --audit-level=low
      - name: Reject critical desktop build-tool advisories
        working-directory: wepo-desktop-wallet
        run: npm audit --audit-level=critical
      - name: Verify patched desktop build-tool transitive dependencies
        working-directory: wepo-desktop-wallet
        run: npm run verify-builder-security
      - name: Verify canonical desktop inputs
        working-directory: wepo-desktop-wallet
        run: npm run verify-canonical-client
      - name: Build unsigned development package
        working-directory: wepo-desktop-wallet
        run: npm run pack
      - name: Verify development package content and icon
        working-directory: wepo-desktop-wallet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appExe = Join-Path $PWD "dist\win-unpacked\WEPO Wallet.exe"
          if (-not (Test-Path -LiteralPath $appExe -PathType Leaf)) {
            throw "Development package executable is missing: $appExe"
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $appExe
          if ($signature.Status -ne "NotSigned") {
            throw "Development package must remain unsigned; got $($signature.Status)."
          }

          npm run verify-packaged-desktop
      - name: Prove release packaging fails closed without signing identity
        working-directory: wepo-desktop-wallet
        shell: pwsh
        run: |
          Remove-Item Env:WEPO_WINDOWS_SIGNER_THUMBPRINT -ErrorAction SilentlyContinue
          Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          $PSNativeCommandUseErrorActionPreference = $false
          npm run dist-win
          $releaseExitCode = $LASTEXITCODE
          if ($releaseExitCode -eq 0) {
            throw "Release packaging unexpectedly succeeded without a signing identity."
          }
          Write-Host "Release packaging refused unsigned output as required (exit $releaseExitCode)."
